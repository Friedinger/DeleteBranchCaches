name: Delete Branch Caches
description: Delete caches for a specific branch.

branding:
  icon: trash
  color: blue

inputs:
  github-token:
    description: GitHub token to use for authentication
    required: true
    default: ${{ github.token }}
  ref:
    description: The branch reference to delete caches for (e.g., 'refs/heads/main'), can be a single string or a yaml list
    required: true
    default: ${{ github.ref }}
  fail-on-warning:
    description: Fail the action if a warning occurs during cache deletion
    required: false
    default: "false"
  dry-run:
    description: List the caches that would be deleted without deleting them
    required: false
    default: "false"
  key-filter:
    description: Only delete caches whose key matches the given glob pattern (e.g. 'npm-*'), combined with ref
    required: false
    default: ""
  max-age:
    description: Only delete caches older than the given duration (e.g. '7d', '24h', '30m'), combined with ref
    required: false
    default: ""

runs:
  using: "node24"
  main: "dist/index.js"
