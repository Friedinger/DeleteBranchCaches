name: Build and Test Action

on: [push]

jobs:
  build:
    name: Build Action
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify dist was not changed locally
        if: github.ref != 'refs/heads/main'
        run: |
          git diff --quiet "$(git merge-base origin/main HEAD)" HEAD -- dist || {
            echo "dist/ must not be committed in feature branches; it is built and committed by CI on main."
            exit 1
          }

      - name: Npm setup
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build action
        run: npm run build

      - name: Upload action artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: action-dist
          path: dist

  test:
    name: Test Action
    runs-on: ubuntu-latest
    needs: build

    strategy:
      max-parallel: 1
      matrix:
        include:
          - ref: ${{ github.ref }}
            fail_on_warning: false
          - ref: "__default__"
            fail_on_warning: false
          - ref: |
              - ${{ github.ref }}
              - ${{ github.ref }}
            fail_on_warning: false
          - ref: "[${{ github.ref }}, ${{ github.ref }}]"
            fail_on_warning: false
          - ref: "__default__"
            fail_on_warning: true
          - ref: "__default__"
            fail_on_warning: false
            dry_run: true
          - ref: "__default__"
            fail_on_warning: false
            key_filter: "test-cache-secondary-*"

    permissions:
      contents: read
      actions: write

    steps:
      - name: Create test file
        run: |
          mkdir -p test-cache
          echo "Creating cache for ${{ github.ref }} on ${{ github.sha }} for job ${{ strategy.job-index }}" > test-cache/test.txt
          if [ "${{ matrix.key_filter }}" != '' ]; then
            mkdir -p test-cache-secondary
            echo "Creating second cache for ${{ github.ref }} on ${{ github.sha }} for job ${{ strategy.job-index }}" > test-cache-secondary/test.txt
          fi

      - name: Create cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test-cache
          key: test-cache-${{ github.run_id }}-${{ strategy.job-index }}

      - name: Create second cache
        if: matrix.key_filter != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test-cache-secondary
          key: test-cache-secondary-${{ github.run_id }}-${{ strategy.job-index }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download action artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-dist
          path: dist

      - name: Run test case (with ref)
        if: matrix.ref != '__default__'
        uses: ./
        continue-on-error: ${{ matrix.fail_on_warning }}
        with:
          github-token: ${{ github.token }}
          ref: ${{ matrix.ref }}
          fail-on-warning: ${{ matrix.fail_on_warning }}
          key-filter: ${{ matrix.key_filter }}
          dry-run: ${{ matrix.dry_run }}

      - name: Run test case (without ref)
        if: matrix.ref == '__default__'
        uses: ./
        continue-on-error: ${{ matrix.fail_on_warning }}
        with:
          github-token: ${{ github.token }}
          fail-on-warning: ${{ matrix.fail_on_warning }}
          key-filter: ${{ matrix.key_filter }}
          dry-run: ${{ matrix.dry_run }}

      - name: Try to restore cache
        id: restore-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test-cache
          key: test-cache-${{ github.run_id }}-${{ strategy.job-index }}

      - name: Try to restore second cache
        id: restore-secondary-cache
        if: matrix.key_filter != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test-cache-secondary
          key: test-cache-secondary-${{ github.run_id }}-${{ strategy.job-index }}

      - name: Verify cache deletion
        run: |
          if [ "${{ matrix.key_filter }}" != '' ]; then
              if [ "${{ steps.restore-cache.outputs.cache-hit }}" = 'true' ]; then
                  echo "Cache with non-matching key retained."
              else
                  echo "Cache with non-matching key was deleted despite key-filter."
                  exit 1
              fi
              if [ "${{ steps.restore-secondary-cache.outputs.cache-hit }}" = 'true' ]; then
                  echo "Cache with matching key was not deleted."
                  exit 1
              else
                  echo "Cache with matching key deleted."
              fi
          elif [ "${{ matrix.dry_run }}" = 'true' ]; then
              if [ "${{ steps.restore-cache.outputs.cache-hit }}" = 'true' ]; then
                  echo "Cache retained as expected (dry run)."
              else
                  echo "Cache was deleted despite dry run."
                  exit 1
              fi
          elif [ "${{ steps.restore-cache.outputs.cache-hit }}" = 'true' ]; then
              echo "Cache was not deleted properly."
              exit 1
          else
              echo "Cache deletion verified."
          fi

  commit-build:
    name: Commit Action Build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: test

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download action artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-dist
          path: dist

      - name: Check for repo changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all dist)" ]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit dist directory
        if: steps.changes.outputs.changes == 'true'
        uses: suzuki-shunsuke/commit-action@5eaa5ecce3ffe93d09a85b946dc5136e3713b1b7 # v1.1.0
        with:
          commit_message: "📦 Update action build [skip ci]"
          files: dist/
          fail_on_self_push: false
